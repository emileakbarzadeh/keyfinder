name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    if: ${{ !github.event.deleted }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    env:
      KEYFINDER_ASSET: Keyfinder-macOS-${{ matrix.arch }}.dmg
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            sandbox = true

      - name: Build and check the app and nix-darwin module
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build the reproducible disk image
        run: nix build .#dmg --no-update-lock-file --print-build-logs --out-link result-dmg

      - name: Verify the standalone app and stage the download
        run: |
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/keyfinder-release" result-dmg
          trap 'hdiutil detach "$RUNNER_TEMP/keyfinder-release"' EXIT
          codesign --verify --strict "$RUNNER_TEMP/keyfinder-release/Keyfinder.app"
          "$RUNNER_TEMP/keyfinder-release/Keyfinder.app/Contents/MacOS/Keyfinder" --diagnostics
          cp -L result-dmg "$KEYFINDER_ASSET"

      - name: Upload the checked disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.KEYFINDER_ASSET }}
          if-no-files-found: error
          archive: false
          retention-days: 7
          overwrite: true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both disk images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Keyfinder-macOS-*.dmg
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Create the release and upload the apps
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Keyfinder ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Keyfinder-macOS-arm64.dmg
            release-assets/Keyfinder-macOS-x86_64.dmg
          body: |
            Requires **macOS 26 or later**. Download the disk image for your Mac:

            - **Apple Silicon (M-series):** `Keyfinder-macOS-arm64.dmg`
            - **Intel:** `Keyfinder-macOS-x86_64.dmg`

            Open the disk image and drag `Keyfinder.app` to Applications. Nix is not required to run it.

            These apps are built with the pinned Nix toolchain and signed ad hoc; they are not Developer ID signed or notarized. If macOS blocks opening the download, use **System Settings → Privacy & Security → Open Anyway** after attempting to open it.
